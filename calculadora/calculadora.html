<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora com tailwind css</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-black min-h-screen flex justify-center items-center">

    <!-- Calculadora -->
    <div class="w-[260px] p-2 bg-red-950 rounded-lg shadow-lg">

        <!-- Display -->
        <div id="display"
            class="w-full bg-red-950 text-white text-right text-2xl p-3 overflow-hidden font-semibold">
            0
        </div>

        <!-- Botões -->
        <div class="w-full flex flex-wrap py-2">

            <!-- Linha 1 -->
            <div class="w-1/4 p-1">
                <button value="%"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    %
                </button>
            </div>

            <div class="w-2/4 p-1">
                <button value="c"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    C
                </button>
            </div>

            <div class="w-1/4 p-1">
                <button value="backspace"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    <i class="bi bi-backspace"></i>
                </button>
            </div>

            <!-- Linha 2 -->
            <div class="w-1/4 p-1">
                <button value="7"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    7
                </button>
            </div>

            <div class="w-1/4 p-1">
                <button value="8"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    8
                </button>
            </div>

            <div class="w-1/4 p-1">
                <button value="9"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    9
                </button>
            </div>

            <div class="w-1/4 p-1">
                <button value="/"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    ÷
                </button>
            </div>

            <!-- Linha 3 -->
            <div class="w-1/4 p-1">
                <button value="4"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    4
                </button>
            </div>

            <div class="w-1/4 p-1">
                <button value="5"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    5
                </button>
            </div>

            <div class="w-1/4 p-1">
                <button value="6"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    6
                </button>
            </div>

            <div class="w-1/4 p-1">
                <button value="*"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    ×
                </button>
            </div>

            <!-- Linha 4 -->
            <div class="w-1/4 p-1">
                <button value="1"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    1
                </button>
            </div>

            <div class="w-1/4 p-1">
                <button value="2"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    2
                </button>
            </div>

            <div class="w-1/4 p-1">
                <button value="3"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    3
                </button>
            </div>

            <div class="w-1/4 p-1">
                <button value="-"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    -
                </button>
            </div>

            <!-- Linha 5 -->
            <div class="w-2/4 p-1">
                <button value="0"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    0
                </button>
            </div>

            <div class="w-1/4 p-1">
                <button value="."
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    .
                </button>
            </div>

            <div class="w-1/4 p-1">
                <button value="+"
                    class="w-full bg-red-800 text-white py-2 rounded hover:bg-red-500 transition">
                    +
                </button>
            </div>

            <!-- Linha 6 -->
            <div class="w-full p-1">
                <button value="="
                    class="w-full bg-black text-white py-2 rounded hover:bg-red-500 transition font-bold">
                    =
                </button>
            </div>

        </div>
    </div>

    <script src="calculadora.js"></script>

</body>

</html>
